<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧校园学工管理系统 · 演示导航</title>
<style>
  body{margin:0;font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f5f7fa;color:#1f2329;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .wrap{max-width:640px;width:100%;padding:32px}
  h1{font-size:24px;margin:0 0 6px}
  .sub{color:#909399;font-size:14px;margin-bottom:28px}
  .card{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid #e8eaec;border-radius:10px;padding:20px 22px;margin-bottom:16px;text-decoration:none;color:inherit;transition:box-shadow .2s,transform .2s}
  .card:hover{box-shadow:0 6px 20px rgba(0,0,0,.08);transform:translateY(-2px)}
  .ico{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
  .pc{background:linear-gradient(135deg,#1890ff,#36cfc9)}
  .mb{background:linear-gradient(135deg,#52c41a,#13c2c2)}
  .t{font-size:16px;font-weight:600}
  .d{font-size:13px;color:#909399;margin-top:3px}
  .foot{color:#bfbfbf;font-size:12px;text-align:center;margin-top:18px}
</style>
</head>
<body>
  <div class="wrap">
    <h1>智慧校园学工管理系统</h1>
    <div class="sub">前端演示 · 纯静态页面，点击进入对应端</div>
    <a class="card" href="学工系统_演示版v4.html">
      <div class="ico pc">🖥️</div>
      <div><div class="t">PC 端管理后台</div><div class="d">学籍异动审批、奖助学金、宿舍、个人中心等</div></div>
    </a>
    <a class="card" href="手机端演示_v2.html">
      <div class="ico mb">📱</div>
      <div><div class="t">移动端演示</div><div class="d">学生 / 辅导员 移动端申请与审核</div></div>
    </a>
    <div class="foot">演示数据均为模拟数据，仅用于功能与流程展示</div>
  </div>
</body>
</html>
